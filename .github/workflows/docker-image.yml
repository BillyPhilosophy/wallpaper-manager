# 手动构建并推送 ARM64 Linux 镜像到 Docker Hub。
# 仓库 Secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN（Access Token，勿用密码）。
name: build-images

on:
  workflow_dispatch:

env:
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }} (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.service }}.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/wallpaper-manager-${{ matrix.service }}:latest
            ${{ env.IMAGE_NAMESPACE }}/wallpaper-manager-${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
