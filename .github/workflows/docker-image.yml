# 手动构建并推送 ARM64 Linux 镜像到 Docker Hub。
# 仓库 Secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN（Access Token，勿用密码）。
name: build-images

on:
  workflow_dispatch:

env:
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: web, suffix: '' }
          - { service: api, suffix: '' }
          - { service: worker, suffix: '', box64_package: box64 }
          - { service: worker, suffix: '-rpi5', box64_package: box64-rpi5arm64ps16k }
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}${{ matrix.suffix }} (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.service }}.Dockerfile
          platforms: linux/arm64
          push: true
          build-args: ${{ matrix.service == 'worker' && format('BOX64_PACKAGE={0}', matrix.box64_package) || '' }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/wallpaper-manager-${{ matrix.service }}:latest${{ matrix.suffix }}
            ${{ env.IMAGE_NAMESPACE }}/wallpaper-manager-${{ matrix.service }}:sha-${{ github.sha }}${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.service }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}${{ matrix.suffix }}
