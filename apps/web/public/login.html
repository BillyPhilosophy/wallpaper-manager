<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="theme-color" content="#0d1018"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>验证访问 · Wallpaper Atelier</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #f1f4f9; background: radial-gradient(circle at 20% 0%, #12345a, transparent 45%), radial-gradient(circle at 90% 100%, #25204b, transparent 45%), #080b11; font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif; }
    main { width: min(100%, 400px); padding: 36px; border: 1px solid #ffffff24; border-radius: 24px; background: #111620e8; box-shadow: 0 24px 70px #0008; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; font-weight: 700; letter-spacing: .02em; }
    .mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: #0a84ff; font-size: 23px; }
    h1 { margin: 0 0 10px; font-size: 25px; }
    p { margin: 0; color: #a1aabc; line-height: 1.65; }
    form { margin-top: 28px; }
    label { display: block; margin-bottom: 9px; font-size: 14px; font-weight: 600; }
    input { width: 100%; padding: 15px; border: 1px solid #ffffff26; border-radius: 12px; outline: none; background: #080b1199; color: #fff; font: 700 25px/1.2 ui-monospace, monospace; letter-spacing: .32em; text-align: center; }
    input:focus { border-color: #0a84ff; box-shadow: 0 0 0 3px #0a84ff30; }
    button { width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 12px; background: #0a84ff; color: #fff; font: 600 16px inherit; cursor: pointer; }
    button:hover { background: #2894ff; }
    button:disabled { opacity: .5; cursor: wait; }
    .error { min-height: 25px; margin-top: 14px; color: #ff8d95; font-size: 14px; }
    .hint { margin-top: 24px; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">W</span><span>Wallpaper ATELIER</span></div>
    <h1>验证你的身份</h1>
    <p>输入 Authenticator 应用当前显示的 6 位动态验证码。</p>
    <form id="login">
      <label for="code">动态验证码</label>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus/>
      <button type="submit">验证并进入</button>
      <p class="error" id="error" role="alert"></p>
    </form>
    <p class="hint">验证成功后，会话有效期内无需重复验证。</p>
  </main>
  <script>
    const form = document.getElementById('login');
    const input = document.getElementById('code');
    const error = document.getElementById('error');
    input.addEventListener('input', () => { input.value = input.value.replace(/\D/g, '').slice(0, 6); });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      error.textContent = '';
      try {
        const response = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: input.value }) });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.message || '验证失败，请稍后重试');
        const requested = new URLSearchParams(location.search).get('next') || '/';
        const next = requested.startsWith('/') && !requested.startsWith('//') && !requested.includes('\\') ? requested : '/';
        location.replace(next);
      } catch (reason) {
        error.textContent = reason instanceof Error ? reason.message : '验证失败，请稍后重试';
        input.select();
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
